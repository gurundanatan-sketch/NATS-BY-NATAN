# NATS BY NATAN — gradle.properties
# Pengaturan JVM untuk proses Gradle (cukup untuk runner GitHub Actions 7 GB RAM)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin (dipakai sebagian plugin Capacitor)
kotlin.code.style=official
