// NATS BY NATAN — build.gradle modul aplikasi Android
apply plugin: 'com.android.application'

// Penandatanganan rilis: dibaca dari variabel lingkungan (GitHub Secrets) atau keystore.properties lokal
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystoreProps.load(new FileInputStream(keystorePropsFile))
def ksFile = System.getenv('NATS_KEYSTORE_FILE') ?: keystoreProps['storeFile']
def hasSigning = ksFile != null && file(ksFile).exists()

android {
    namespace = "com.natan.nats"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.natan.nats"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        resValue "string", "build_label", "NATS BY NATAN"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Jangan abaikan file berawalan titik/underscore di www (mis. _app)
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('NATS_KEYSTORE_PASSWORD') ?: keystoreProps['storePassword']
                keyAlias System.getenv('NATS_KEY_ALIAS') ?: keystoreProps['keyAlias']
                keyPassword System.getenv('NATS_KEY_PASSWORD') ?: keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "NATS (Debug)"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "NATS BY NATAN"
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json tidak ditemukan, plugin google-services tidak dipakai (push notification nonaktif)")
}
